# The first config commit's role assignments (ARCH §4.3). `worker` is the
# role every root agent resolves ("roots are workers"), so its `tools:`
# grant is what an interactive conversation can call out of the box — and
# it is the whole tool pool this install ships (`litany prime` seeds
# `<data-root>/tools/`). Granting a subset here is drift, not minimalism:
# a name added to the pool and forgotten here is grantless for everyone.
# `src/install/tests.rs::the_shipped_worker_grant_is_the_whole_tool_pool`
# holds the two in step. Narrowing a deployment is an operator edit of
# this file (or a `<config-root>/template/` override) — policy lives in
# the config, never in code.
#
# `max_output_tokens:` (optional, per role) is the ceiling on ONE model
# call's output — the third and last of the three token limits, beside
# the §6 `budgets:` whole-tree spend and the §5.2 manifest's
# `budget_tokens` prompt budget, and until bl-a928 the only one an
# operator could not state. Omitted takes the harness default of 4096,
# which is small for a role whose job is writing files: a step that
# reaches it is refused as a truncation (§2.10), never committed and
# never executed, so the number is worth stating where a role's answers
# are long. It is not settable from a provider row's `body_defaults`:
# brazen fills only what a request leaves absent and the canonical
# request always states this field, so a row naming it silently loses.
# Nothing ships with one set — an output ceiling raised for every
# workspace is an operator's decision about their own models.
roles:
  worker:
    provider: anthropic
    model: claude-sonnet-5
    tools: [apply_patch, bash, cd, dispatch, load_skill, message, python, read_file, remember, search_history]
  # The compactor declares none: its pair (`write_summary` /
  # `mark_for_deletion`) is injected by the compaction procedure and is
  # never declarable here (ARCH §2.7, §4.3).
  compactor:
    provider: anthropic
    model: claude-haiku-4-5
  # The reviewer ships **declared and unbound** (ARCH §4.3): the basic
  # agentic loop dispatches nobody here, so this row costs nothing until
  # a config binds `worker_flush: dispatch(reviewer)` — the seeded
  # `workflows/learning-loop.yaml`. Declaring it in the template is what
  # makes adopting the learning loop a config edit rather than an
  # authoring act (`docs/DESIGN_LEARNING_LOOP.md` §2). Its grant is its
  # confinement: read the transcript and the skills, edit files, nothing
  # else — no `bash`, no `dispatch`, no `message`. Its model is the
  # compactor's, for the same reason.
  reviewer:
    provider: anthropic
    model: claude-haiku-4-5
    tools: [apply_patch, read_file]
  # The planner ships **declared and unbound** too (ARCH §6 *Plan mode
  # is a lineage*), on the reviewer's precedent and for its reason: no
  # shipped workflow dispatches it, so this row costs an install that
  # never uses it nothing, and it makes plan mode a config edit rather
  # than an authoring act. It is reachable with no config at all — any
  # agent whose grant carries `dispatch` may `dispatch(planner)` today.
  #
  # Its grant is its confinement, and the confinement is the role: read
  # the tree by path, search this workspace's history, load a skill.
  # No `apply_patch`, no `python` and no `remember` (the three whose
  # purpose is to change something), no `dispatch` (a planner that can
  # spawn a fleet is not planning), no `message` (its plan is its
  # terminal response, which is delivered), and no `bash` — which is
  # the trade worth naming, since without a shell it cannot `grep`,
  # `find` or list a directory. A shell is not confinable by a grant
  # (mechanical confinement is the v1.1 sandbox's, ARCH §3.6), so
  # granting `bash` here would trade a claim that HOLDS for one that
  # merely asks. A deployment that wants a stronger planner adds the
  # word to this list, where an operator can weigh it.
  #
  # Its model is the worker's, not the compactor's: judging what a
  # change would take is the harder half of doing it, and a plan that
  # is wrong costs more than the tokens it saved.
  planner:
    provider: anthropic
    model: claude-sonnet-5
    tools: [load_skill, read_file, search_history]
