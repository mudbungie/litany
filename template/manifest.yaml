roles:
  worker:
    pinned:
      # The lineage's durable facts (ARCH §5.5): cut out of the followed
      # config commit at the fork and capped at the write, so it is
      # always small enough to ride the head of every model call. The
      # compactor does not pin it — its subject is the branch's history,
      # and a dispatch-written fact is not that.
      - facts.md
      - goal.md
      - soul.md
      - descriptions/**
    order:
      - summary/**
      - skills/**
    budget_tokens: 150000
    overflow: drop_oldest_summaries
  compactor:
    pinned:
      - goal.md
      - soul.md
    # The compactor's subject is the branch's history, and history has
    # exactly two homes: the transcript (always composed, never an
    # `order` category) and the summary chain. The chain composes here
    # or nowhere — the compaction landing admits only the summary and
    # the deletions (ARCH §2.6), so a prior compactor's reasoning never
    # reaches the dispatching branch's transcript. A summary it cannot
    # see is a summary it destroys when it supersedes it, so this
    # category is what "signal-preserving" costs, not a preference.
    # Work products stay out: their creation is already in the
    # transcript, and they are "everything else" with no honest glob
    # (§2.7, §5.1).
    order:
      - summary/**
    budget_tokens: 50000
    overflow: truncate
  # The planner's subject is the goal and the tree it can read, so it
  # composes what the worker does minus the work products it has no tool
  # to touch: the lineage's facts (it must plan against what the
  # workspace already knows), its goal and soul, and the tool
  # descriptions — without which it would plan around tools it has. The
  # summary chain and the workspace skills follow, because a plan that
  # re-proposes what an earlier span already settled is a plan the
  # operator has read before.
  planner:
    pinned:
      - facts.md
      - goal.md
      - soul.md
      - descriptions/**
    order:
      - summary/**
      - skills/**
    budget_tokens: 100000
    overflow: drop_oldest_summaries
  reviewer:
    pinned:
      - goal.md
      - soul.md
    # The reviewer's subject is the span about to be squashed — the
    # transcript, which is always composed and is never an `order`
    # category — plus the two things it may propose against: the summary
    # chain (what earlier checkpoints already carried forward, so it does
    # not re-propose it) and the workspace skills its dispatch commit
    # checks out, so a fresh read precedes every write by construction
    # (`docs/DESIGN_LEARNING_LOOP.md` §2). Control files are not in its
    # tree at all (ARCH §2.2), so no glob here could reach one.
    order:
      - summary/**
      - skills/**
    budget_tokens: 50000
    overflow: truncate
