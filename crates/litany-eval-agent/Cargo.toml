[package]
name = "litany-eval-agent"
version = "0.1.0"
edition = "2024"
description = "Harness driver for the litany evaluation runner: the far side of the ARCH §9.3 agent seam"
license = "MIT"
# Workspace-internal, like `agent-eval` (ARCH §9.3): the driver is
# evaluation tooling for this repo's suite, not part of the published
# litany crate.
publish = false

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "litany-eval-agent"
path = "src/main.rs"
