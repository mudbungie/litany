name: CI

on:
  # Deliberately NO push arm. On a push to main this workflow still runs —
  # once, as the workflow_call'd instance inside release-plz.yml's run (its
  # `ci` job does `uses: ./.github/workflows/ci.yml`, and its release job
  # `needs:` that instance). A push arm here would run the identical jobs a
  # second time per push for nothing. Pull requests still get CI directly
  # via the pull_request arm. Consequence: this workflow has no runs of its
  # own on main, so anything that reads them (e.g. a status badge) must
  # point at release-plz.yml instead — the README badge does.
  pull_request:
    branches: [main]
  # Makes this workflow reusable so release-plz.yml can run it inside its
  # own push-triggered run. That placement is load-bearing: crates.io
  # trusted publishing refuses OIDC tokens minted under a workflow_run
  # trigger, and a called workflow executes as part of the CALLER's run, so
  # the release's OIDC claim carries trigger=push and workflow
  # release-plz.yml — the identity crates.io is configured to trust. See
  # release-plz.yml's header.
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure git identity
        run: |
          git config --global user.email "ci@litany.local"
          git config --global user.name "litany CI"

      - name: Install pinned Rust toolchain
        # rust-toolchain.toml is the single source of the pin (channel +
        # components). Do NOT name a toolchain here — a floating
        # dtolnay/rust-toolchain@stable would drift from what the hook and
        # agents run, and pinning a version in this file would fork the pin
        # into two homes. rustup ships on ubuntu-latest; the first cargo
        # command in the repo makes it auto-install the exact toolchain and
        # components from rust-toolchain.toml (override install), so CI, the
        # pre-commit gate, and every agent build under identical
        # rustc / rustfmt / clippy.
        run: |
          cargo --version
          rustup show active-toolchain

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-tarpaulin
        # Pin to 0.35.2: 0.35.3 was yanked, and 0.35.4+ silently drops
        # inline `#[cfg(test)] mod tests;` files from tarpaulin's coverable
        # denominator. Without the pin, taiki-e/install-action grabs the
        # latest release and the runner reports a smaller "100% covered"
        # denominator than `make ci` does locally — same source tree,
        # different floors. See tarpaulin.toml for the matching local
        # requirement.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin@0.35.2

      - name: Resolve the pinned brazen version
        # The pin's one home is the `brazen = "=<version>"` dependency in
        # Cargo.toml. `make brazen-pin` derives it there (Makefile
        # BRAZEN_PIN), the same line the crate's load-time version guard
        # reads (ARCH §4.4). Never write the number in this file: a copy
        # here would drift from the manifest, and CI would then install a
        # `bz` the guard rejects.
        id: brazen
        run: echo "pin=$(make --no-print-directory brazen-pin)" >> "$GITHUB_OUTPUT"

      - name: Cache the brazen adapter binaries
        # Keyed on the pin alone — `cargo install brazen --version =<pin>`
        # is reproducible, so a hit is exactly the binary the pin names.
        # Deliberately no restore-keys: a `bz` left over from an older pin
        # would fail the version guard, and a cold miss costs one cargo
        # install. Two homes, both pin-derived and both populated by `make
        # ci` itself, so neither needs an install step here:
        #   - ~/.cache/litany/bz/<pin> is what the TEST targets exec (the
        #     Makefile's BZ_TEST_ROOT — pin-keyed, put first on PATH so the
        #     e2e tests never depend on the ambient `bz`, README "The
        #     pinned adapter under test"). `make coverage` installs it.
        #   - ~/.cargo/bin/bz is the ambient install `make test-install`
        #     lays down while exercising the install contract.
        # Only the binaries are cached; the registry/git caches are the step
        # above, and cargo-tarpaulin has its own installer.
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/litany/bz
            ~/.cargo/bin/bz
          key: ${{ runner.os }}-bz-homes-${{ steps.brazen.outputs.pin }}

      - name: make ci
        run: make ci
