name: store-scan

# The balls task store, judged by this repo's own rule table (pattern from yog
# bl-1043). `bl` publishes this project's balls on `balls/tasks` — a separate
# ref on THIS remote — and CI never otherwise reads it. The local write path is
# gated (the machine-global bl-leak-gate runs scripts/leak-scan.sh over the
# store before every push), but the local gate is one config edit away and a
# raw `git push` in the store clone skips it entirely; both land here. This job
# is DETECTION, not prevention: by the time it runs the material is on the
# remote and the remedy is a history rewrite.
on:
  schedule:
    # Daily. GitHub disables cron after 60 idle days; workflow_dispatch is the
    # hand path — run it once before making the repo public.
    - cron: "23 6 * * *"
  workflow_dispatch:
  # And whenever the JUDGEMENT changes: a new rule re-judges an unmoved store.
  push:
    branches: [main]
    paths:
      - scripts/leak-rules.sh
      - scripts/leak-scan.sh
      - .github/workflows/store-scan.yml

permissions:
  contents: read

jobs:
  tasks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The alarm's one issue.
      issues: write
    steps:
      # The scanner and its rule table, from the source ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The store beside it. `balls/tasks` is the configured task-branch; a
      # re-pointed branch must be renamed here too — the scan failing loudly on
      # a missing ref is the signal.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: balls/tasks
          path: store
          persist-credentials: false
      # Findings are truncated by the scanner itself: an Actions log outlives
      # the run and is public the moment the repo is.
      - name: Scan the task store
        working-directory: store
        run: "$GITHUB_WORKSPACE/scripts/leak-scan.sh"
      # The alarm (scripts/alarm.sh, bl-2146): the first red run of a streak
      # opens one issue that mentions the owner, later red runs add nothing,
      # and the next green run closes it. `continue-on-error` on both, so the
      # run's colour is always the work's own and never the alarm's.
      - name: Raise the alarm, once per red streak
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/alarm.sh red
      - name: Stand the alarm down
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/alarm.sh green
