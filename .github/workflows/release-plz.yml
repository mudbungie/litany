name: Release-plz

# Build-gated, hands-off release. Five jobs, all in ONE push-triggered run:
#
#   * ci — the full CI workflow, executed here via
#     `uses: ./.github/workflows/ci.yml` (workflow_call). A called workflow
#     runs INSIDE the caller's run, and that placement is the point: crates.io
#     trusted publishing REFUSES OIDC tokens minted under a `workflow_run`
#     trigger ("due to security concerns"), which is how the release job used
#     to be gated — CI green never published anything. Running CI as a called
#     job instead keeps the OIDC claim at trigger=push / workflow
#     release-plz.yml (the identity crates.io trusts) while the release job
#     still hard-gates on it via `needs:`. ci.yml has no push arm of its own,
#     so per push to main CI runs exactly once — here (PRs still trigger
#     ci.yml directly).
#   * release-plz PR (every push to main) — opens/updates ONE "release PR" that
#     bumps the version in Cargo.toml/Cargo.lock, and nothing else: CHANGELOG.md
#     is hand-maintained and release-plz never writes it (`changelog_update =
#     false` in release-plz.toml — rationale there, bl-7558). It never
#     publishes; it just keeps the next release queued, and `merge-release-pr`
#     below merges it — once the changelog names the version it proposes. So
#     the one act a release still asks of a person is landing `make
#     promote-changelog VERSION=<the version the PR proposes>` on main (via the
#     normal task-worktree flow), which stamps the accumulated [Unreleased]
#     section as that version; nothing after it is touched by a hand. The
#     GitHub Release body is empty by consequence (release-plz
#     takes it from the changelog only when it manages the changelog);
#     CHANGELOG.md in the tagged tree is the record, which is the whole reason
#     the merge waits on it. It does not wait on the ci job — it touches
#     no artifact that CI protects.
#   * release (`needs: ci`, so only after CI in THIS run is green) — releases
#     any version on main that is not out yet: tags it `litany-v<version>`
#     (release-plz.toml's `git_tag_name` — the bare `v*` tags belong to the
#     lernie era before the bl-2f58 rename fence), cuts a
#     GitHub Release and publishes it to crates.io. A release only ever ships
#     a GREEN build — never an untested commit.
#   * release-binaries — builds the `litany` binary and attaches its linux-gnu archive to that
#     Release. It runs in the SAME workflow run and `needs:` the release job,
#     NOT as a separate `on: release` workflow — a Release created by the
#     default GITHUB_TOKEN cannot trigger another workflow (GitHub's
#     anti-recursion rule), so a separate binaries workflow would silently never
#     fire without a PAT. `workflow_dispatch` with `binaries_tag` backfills an
#     existing tag (still behind the CI gate, like everything downstream of
#     `needs: ci`).
#   * merge-release-pr (`needs: ci, release-plz-pr, release-plz-release`) —
#     merges the release PR this run just refreshed, once CHANGELOG.md names
#     the version it proposes, then dispatches this workflow again so the
#     merged bump is the one that publishes. Its whole derivation is the
#     section headed AUTO-MERGE below; neither sibling repository's mechanism
#     transplants here, and neither sibling has a changelog to wait on.
#   * prune-release-branches (right after the release-plz PR job) — deletes
#     every `release-plz-*` branch that has no open PR. release-plz pushes a NEW
#     timestamped branch each time it refreshes the release PR, and pushes it
#     BEFORE opening the PR, so superseded and orphaned branches pile up one per
#     push to main — GitHub's "Automatically delete head branches" setting only
#     fires on merge and never sees them. Because this job runs right after the
#     PR job, the current release PR is already open, which makes "has no open
#     PR" an exact test for "superseded or orphaned".
#
# So the flow is: merge work to main -> this run's ci job runs CI and the
# release PR is kept fresh; when releasing, land the promote-changelog commit
# (above) -> that push's run merges the release PR and dispatches this workflow
# -> the dispatched run's ci job goes green -> the new version is released AND
# its binaries build and upload. No hand touches the pull request.
# `workflow_dispatch` is the manual escape hatch: same chain (ci -> release ->
# binaries), triggered by hand.
#
# Bumps default to PATCH (0.0.1 -> 0.0.2). See release-plz.toml for the
# `[minor]` / `[major]` opt-in markers.
#
# One-time repo setup:
#   * Settings -> Actions -> General -> Workflow permissions: enable "Allow
#     GitHub Actions to create and approve pull requests" — else the release-pr
#     job 403s ("GitHub Actions is not permitted to create or approve pull
#     requests").
#   * A crates.io TRUSTED PUBLISHER for the `litany` crate — the model that
#     replaces a stored API token: instead of keeping a long-lived secret in
#     this repo, crates.io records that one named workflow file in one named
#     GitHub repo may publish one named crate, and at run time GitHub mints a
#     short-lived signed OIDC token asserting exactly that identity (repo,
#     workflow, ref). release-plz trades it for a ~30-minute crates.io token
#     scoped to this crate, so there is no secret in the repo to leak and a
#     captured token expires in minutes. Configure it at
#     https://crates.io/crates/litany/settings -> Trusted Publishing, with
#     owner `mudbungie`, repository `litany`, workflow filename
#     `release-plz.yml`, environment empty — the filename is matched literally
#     against the OIDC claim, so RENAMING THIS FILE breaks publishing until
#     the crates.io entry is updated to match.
#
#     The release job asks GitHub for that token via `id-token: write`; nothing
#     else is needed and NO CARGO_REGISTRY_TOKEN secret is set. release-plz
#     performs the exchange internally (it implements the same crates.io API
#     calls as rust-lang/crates-io-auth-action), so that action must NOT also
#     be added. Caveat: trusted publishing cannot create a crate that does not
#     exist yet — `litany` was published manually at 0.0.0, which satisfies it.
#   * RELEASE_PLZ_TOKEN — OPTIONAL fine-grained PAT (contents + pull-requests
#     write), so the release PR's own commits re-trigger CI. The default
#     GITHUB_TOKEN cannot trigger workflows from its own pushes; the job falls
#     back to it when RELEASE_PLZ_TOKEN is unset.

# ---------------------------------------------------------------------------
# AUTO-MERGE, AND WHY IT IS A JOB IN THIS FILE (bl-6364)
#
# Merging the release PR used to be the human control point. It is not one any
# more (operator ruling 2026-09-03): the decision it asked for was already made
# by the work that landed on main, and the publish is gated AFTER the merge by
# release-plz-release's own `needs: ci`, so a red tree bumps a version on main
# and ships nothing. Holding the PR open bought nothing and cost every release
# a hand.
#
# WHAT GATES THE PUBLISH HERE, established before any of this was designed:
# this run's own `ci` job, reached through `needs:`. Nothing observes a CI run
# from a distance, because a `workflow_run` arm would break trusted publishing
# (the trigger comment below). The release PR's own checks are NOT that gate
# and could not be: every `pull_request` CI run on a `release-plz-*` head in
# this repository has started ZERO JOBS — 30 such runs across every release PR
# the repository has ever had, each of them `action_required` (created awaiting
# approval and never approved) or, once the head moved past it, `failure` with
# `total_count: 0` jobs. Those failures are the ones that look like a red build
# and are not one; the releases published anyway, which is the proof that the
# PR's checks gate nothing here. A merge gated on them, or on the pull
# request's check rollup, would merge nothing, forever — the open 0.0.9 PR
# reports mergeStateStatus UNSTABLE for exactly that reason, and this job
# prints that field without ever gating on it.
#
# NEITHER SIBLING MECHANISM TRANSPLANTS.
#   * yog merges from a SEPARATE workflow woken by `workflow_run` on its CI,
#     using a fine-grained PAT whose own push re-triggers everything, so it
#     needs no dispatch. `gh api repos/mudbungie/litany/actions/secrets`
#     answers `total_count: 0` — this repository has no secrets at all, so
#     there is no PAT to merge with and no token here whose push triggers
#     anything; and the `workflow_run` arm it hangs on is refused on the
#     crates.io-OIDC grounds above.
#   * lernie wakes on ITS release workflow completing, because its release job
#     is gated by observing CI from a distance. Here the gate is `needs: ci`
#     INSIDE this run, so the thing lernie has to observe is a job this file
#     can simply depend on. A second workflow would be a trigger bought for
#     nothing.
#   * thrall's merge-release-pr job is the near twin — same absent PAT, same
#     in-run gate — and this job is derived from it rather than from the other
#     two. It still does not transplant unchanged: thrall keeps no
#     hand-maintained changelog, so it has no guard 6 below, and it merges with
#     `--delete-branch`, which this repository must not copy for the reason
#     under the ordering paragraph.
#
# WHICH TOKEN MERGES, AND WHY THE DISPATCH IS NOT OPTIONAL. GITHUB_TOKEN,
# because there is no other token here. That makes the merge's push to main
# fire NOTHING — GitHub, verbatim: "with the exception of `workflow_dispatch`
# and `repository_dispatch`, other GITHUB_TOKEN triggered events do not create
# workflow runs" — so a merge on its own would leave the bump on main,
# unpublished, until some unrelated push happened by. The same sentence names
# the way out and this job takes it: after a merge it dispatches THIS workflow
# on main. That is not a second door into the release path. `workflow_dispatch`
# is already one of this file's two triggers, and the release job's `needs: ci`
# does not vary by trigger, so the dispatched run re-runs the whole gate on the
# merged tree before publishing anything.
#
# The dispatched run cannot re-enter this job: release-plz-pr is push-only, so
# on a dispatch it is SKIPPED and every `needs:` of it skips with it. There is
# no loop to bound because there is no second merge to make.
#
# ORDERING, AND THE TWO JOBS THIS ONE DELIBERATELY DOES NOT NAME. The
# dependency on release-plz-release is not decoration: that job checks out the
# main BRANCH rather than this run's sha, so a merge landing while it runs
# would hand it a tree nothing gated. Merging strictly after it removes the
# race — this run publishes whatever main already owed, then the merge lands
# the bump, then the dispatched run publishes that. release-binaries is not
# named because it checks out a TAG the release job already pushed, so what
# main does underneath it is none of its business. prune-release-branches is
# not named either: it needs only the PR job, so it finishes minutes before
# this one can start (this one waits on the whole of CI), and even reordered it
# keeps the branch backing an open pull request. That is also why this job
# merges WITHOUT `--delete-branch` where thrall's uses it: this repository has
# `delete_branch_on_merge` enabled, so GitHub deletes the merged head itself,
# and a second deleter would only race the pruner into a failed `git push
# --delete` of a branch already gone.
#
# THE GUARDS. Six, and none of them is the check rollup:
#
#   1. The head branch is release-plz's own timestamped shape, anchored end to
#      end — `release-plz-YYYY-MM-DDTHH-MM-SSZ`. A branch merely STARTING with
#      the prefix does not pass.
#   2. The author is the Actions bot (`app/github-actions`, which is what opens
#      every release PR here, there being no PAT) or the repository owner (a
#      PAT's identity, so the guard survives one being added later).
#   3. Every changed file is `Cargo.toml` or `Cargo.lock`, and there is at
#      least one. That is what a release PR IS here — `changelog_update =
#      false`, so a CHANGELOG.md inside one would mean that decision had moved
#      and this guard should be re-derived rather than widened. It is a
#      structural test no human pull request passes by accident.
#   4. Not a draft, and GitHub says MERGEABLE.
#   5. The head commit's first parent is this run's commit — the tree `ci` just
#      passed. release-plz rebases the release branch onto main on every push
#      here, so the bump sits directly on `github.sha`; the job gates on that
#      identity rather than assuming it, so what it merges can only ever be the
#      gated tree plus the version bump. Checked on the two most recent release
#      PRs: #18's head sat on the sha of the push run that gated it, and #19's
#      on the main tip of its own moment.
#   6. CHANGELOG.md, at the commit this run gated, already carries a
#      `## [<the version the PR proposes>](<this repo>/compare/...)` heading —
#      the line `make promote-changelog VERSION=x.y.z` writes, tested with that
#      target's own predicate. The version is read from `[package] version` in
#      the PR head's own Cargo.toml, which is the bump itself; the compare URL
#      is derived from `github.repository` so no second copy of it exists.
#
#      THIS GUARD IS LITANY'S ALONE, and it is the one place this job declines
#      to be thrall's. The changelog here is hand-maintained and is the ONLY
#      changelog authority (release-plz.toml, bl-7558); the GitHub Release body
#      is empty by consequence, so CHANGELOG.md in the tagged tree is the
#      entire record of what a version contains. Merging on green alone would
#      publish a version per push to main whose own tagged tree does not name
#      it — 0.0.8 already shipped exactly that way, by hand, its notes still
#      under [Unreleased] — and would quietly retire promote-changelog, this
#      file's stated ordering and CHANGELOG.md's own header sentence, none of
#      which this ball was asked to reverse.
#
#      So the hand the ruling removes is the click on the pull request, which
#      carries no information. What remains is the act that writes the
#      release's notes, which no machine can author: the promotion commit IS
#      the release decision, and everything after it — the merge, the tag, the
#      publish, the binaries — happens with no hand. The hold prints the exact
#      command that clears it. It is severable in one direction: delete guard 6
#      and this repository releases on every push like its siblings; that is a
#      policy change and should be made as one, together with the three
#      documents above.
#
# READS HOLD, ACTS SHOUT (bl-0187). Every fact this job reads through the API
# — the head commit's parent, the head's Cargo.toml, the gated tree's
# CHANGELOG.md — is a HOLD when it cannot be read, printed and skipped, never a
# failed job. The job is a reconciler and wake-ups are plentiful (one per push
# to main), so a fact unread this time is re-judged in minutes; and a red
# release-plz run should mean the tree or the release is broken, not that
# GitHub answered 504 once. The first armed run met exactly that 504 on the
# first read and died under `set -e` before printing a single verdict. The two
# ACTS are the exception and stay loud: `gh pr merge` and the dispatch are not
# reads, and a failure in either is worth the red.
#
# A verdict line is printed for EVERY open pull request on EVERY run, passing
# or not: a mechanism that merges silently is one nobody can audit, and the run
# log is the only record it keeps. It writes nothing into any pull request body
# or comment — there is nothing worth saying there that the log does not say,
# and a body cannot be un-published (AGENTS.md, "Published text nobody
# committed").

# No `workflow_run` arm — crates.io refuses trusted publishing under it (see
# the ci job above); the CI gate is the in-run `needs: ci` instead.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      binaries_tag:
        description: "Build + upload binaries for this existing tag (e.g. litany-v0.0.1). Leave empty for a normal publish."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    name: CI
    # The full CI workflow, run inside THIS run (see the header: the release
    # job `needs:` this, and workflow_call placement is what keeps the OIDC
    # claim publishable). Runs on both triggers — push and manual dispatch —
    # so a dispatched release is gated exactly like an automatic one. Job-level
    # `permissions` on a `uses:` job set the ceiling for every job in the
    # called workflow; CI only checks out and builds, so read suffices.
    if: github.repository_owner == 'mudbungie'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    # Only a direct push to main maintains the release PR (not a manual
    # dispatch). Owner guard: never runs in a fork. Safe against fork-PR
    # abuse because none of this workflow's triggers are reachable from a fork
    # PR — a fork PR fires `pull_request` (not requested here), never
    # `push`-to-main / `workflow_dispatch`, both of which need
    # write access to upstream.
    if: github.repository_owner == 'mudbungie' && github.event_name == 'push'
    # Never run two release-PR updates at once — they would race on the branch.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # No registry credential here: this job only opens the release PR, it
          # never publishes.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    # Release only on a GREEN build: `needs` on the called CI workflow above.
    # If any CI job fails (or the ci job is skipped, as in a fork), this job
    # is skipped — the implicit success() in `if` sees to it. This is the
    # whole build gate; there is no workflow_run arm anymore.
    needs: ci
    # Job-level permissions REPLACE the workflow-level block rather than adding
    # to it, so `contents: write` is restated here — the job needs it to push
    # the `litany-v<version>` tag and cut the GitHub Release. `id-token: write` is the
    # trusted-publishing grant: it lets the job ask GitHub for the signed OIDC
    # token that release-plz trades for a short-lived crates.io token (see the
    # header). It is scoped to this one job — the other jobs never publish.
    permissions:
      contents: write
      id-token: write
    # Owner guard (redundant with the ci job's, kept as defense in depth).
    # Both triggers release once CI is green: that is the point for push, and
    # for workflow_dispatch it is the manual escape hatch.
    if: github.repository_owner == 'mudbungie'
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    # Tell the binaries job whether a release actually happened, and WHICH tag
    # it cut. The tag must be handed off here, not re-derived downstream: this
    # job checks out the BRANCH tip (which may have advanced past the run's
    # pinned sha while CI ran), so the new tag can be a descendant of
    # github.sha — invisible to any ancestor walk (`git describe`) from the
    # binaries job's own checkout. The action's `releases` output is the one
    # authoritative record of what was tagged.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the BRANCH, not a bare SHA: release-plz runs `git rev-parse
          # @{upstream}` to find the current branch, which fails on a detached
          # HEAD. `ref_name` is main for both triggers (push to main, and a
          # manual dispatch on main).
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # Publishing is authenticated by trusted publishing (`id-token: write`
          # above), not by a stored registry secret.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract the released tag
        # `releases` is the action's JSON record of what it just released,
        # e.g. [{"package_name":"litany","prs":[],"tag":"litany-v0.0.1","version":
        # "0.0.1"}]. One crate in this workspace releases, so .[0].tag is it.
        # Via env, not inline interpolation, so the JSON never touches the
        # shell as code.
        id: released
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: echo "tag=$(jq -r '.[0].tag' <<<"$RELEASES")" >> "$GITHUB_OUTPUT"

  release-binaries:
    name: litany x86_64-unknown-linux-gnu
    needs: release-plz-release
    # Build binaries when a release was just cut, OR for a tag named manually
    # (backfill). `needs` is skipped when the release job was skipped, so this
    # can never run in a fork either.
    if: >-
      needs.release-plz-release.outputs.releases_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.binaries_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve + check out the release tag
        id: tag
        shell: bash
        env:
          # Manual backfill input wins; otherwise the tag the release job just
          # cut, handed off via its `tag` output. Never re-derived here with
          # `git describe`: this job checks out the run's pinned sha, and the
          # release job tags the branch TIP — which can be a descendant of
          # that sha (main advanced during CI), so an ancestor walk from here
          # misses the tag. Exactly that raced on the v0.0.1 publish.
          BACKFILL_TAG: ${{ github.event.inputs.binaries_tag }}
          RELEASED_TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: |
          tag="${BACKFILL_TAG:-$RELEASED_TAG}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Build the tagged (released) code, not whatever main's tip is now.
          # The tag ref (and its commit) arrived with the fetch-depth-0
          # checkout, which ran after the release job pushed it (`needs`).
          git checkout "$tag"
      - uses: dtolnay/rust-toolchain@stable
      # Builds `cargo build --release`, archives the binaries as
      # litany-x86_64-unknown-linux-gnu.tar.gz and uploads it to the Release
      # for the resolved tag. Uploading assets with GITHUB_TOKEN is fine — only
      # *triggering a new workflow* from a token-made event is what GitHub blocks.
      #
      # `include:` puts README.md and LICENSE in the archive beside the
      # binary. Until bl-33ef the tarball was one bare executable, so a
      # release user had no install instructions at all — not the `bz`
      # step, not the pin, not the harness-root note — while the crates.io
      # user got the same README as the landing page. The docs ride with
      # the artifact for the same reason the pin does: reachable from what
      # you downloaded, not only from the repo you did not clone.
      - name: Build and upload litany
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: litany
          target: x86_64-unknown-linux-gnu
          archive: litany-$target
          include: README.md,LICENSE
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  merge-release-pr:
    name: merge the release PR
    runs-on: ubuntu-latest
    # The gate, the ordering and the recursion stop, all in one list. The bare
    # `needs` carries an implicit success(), so a red `ci`, a failed PR job or
    # a failed release all skip this job; and `release-plz-pr` is push-only, so
    # the run this job dispatches skips it and skips this with it. `ci` is
    # named although `release-plz-release` already needs it — the gate should
    # be readable here, not inferred through another job.
    needs: [ci, release-plz-pr, release-plz-release]
    # Owner guard: never runs in a fork, like every other job here.
    if: github.repository_owner == 'mudbungie'
    timeout-minutes: 10
    permissions:
      # To merge the pull request.
      contents: write
      # To read the open set and merge.
      pull-requests: write
      # To dispatch this workflow again after the merge. Without it the bump
      # lands on main and nothing publishes it.
      actions: write
    # Two runs finishing at once would otherwise race on one merge. Serialize;
    # the loser re-lists and finds the pull request already gone.
    concurrency:
      group: merge-release-pr
      cancel-in-progress: false
    steps:
      - name: Judge every open pull request, and merge a green release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          # The commit `ci` passed in this run. Guards 5 and 6 read it.
          GATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          prs="$(gh pr list --state open --limit 50 \
            --json number,headRefName,headRefOid,isDraft,mergeable,mergeStateStatus,author,files)"

          count="$(jq 'length' <<<"$prs")"
          echo "open pull requests: $count"
          if [ "$count" -eq 0 ]; then
            echo "nothing to judge"
            exit 0
          fi

          # One line per pull request: number, head sha, verdict, merge state.
          # Guards 1-4 are decided here so the shell below merges or reports
          # and never re-decides; guards 5 and 6 need API reads and are below.
          verdicts="$(jq -r --arg owner "$OWNER" '
            def bump_files: ["Cargo.toml", "Cargo.lock"];
            .[] | [
              .number,
              .headRefOid,
              (if (.headRefName
                   | test("^release-plz-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$")
                   | not)
                 then "skip: head \(.headRefName) is not a release-plz branch"
               elif (.author.login != "app/github-actions" and .author.login != $owner)
                 then "skip: author \(.author.login) is neither the Actions bot nor the repository owner"
               elif .isDraft
                 then "skip: draft"
               elif ((.files | length) == 0)
                 then "skip: changes no files"
               elif (.files | map(select(.path as $p | bump_files | index($p) | not)) | length) > 0
                 then "skip: touches \(.files | map(.path) | join(" ")), which is not a version bump"
               elif (.mergeable != "MERGEABLE")
                 then "hold: GitHub says mergeable=\(.mergeable)"
               else "candidate" end),
              .mergeStateStatus
            ] | @tsv' <<<"$prs")"

          merged=0
          while IFS=$'\t' read -r number sha verdict state; do
            [ -n "$number" ] || continue
            if [ "$verdict" != "candidate" ]; then
              printf 'PR %s  %s  [merge state %s]\n' "$number" "$verdict" "$state"
              continue
            fi

            # Guard 5: the bump must sit on the commit this run gated. The
            # release PR's own checks never run in this repository, so this
            # identity — not a check — is what ties the merge to a green tree.
            # An API read that fails is a HOLD, never a job failure: this
            # job is a reconciler, wake-ups are plentiful, and a red run
            # should mean the tree or the release is broken. The
            # `if ! x="$(...)"` form is the one that does not trip `set -e`.
            # Learned on the first armed run, which met an HTTP 504 here and
            # died before printing a single verdict.
            if ! parent="$(gh api "repos/$GH_REPO/commits/$sha" -q '.parents[0].sha')"; then
              printf 'PR %s  hold: could not read the head commit; the next wake-up re-judges  [merge state %s]\n' \
                "$number" "$state"
              continue
            fi
            if [ "$parent" != "$GATED_SHA" ]; then
              printf 'PR %s  hold: head sits on %s, not the gated %s  [merge state %s]\n' \
                "$number" "${parent:0:8}" "${GATED_SHA:0:8}" "$state"
              continue
            fi

            # Guard 6: the changelog must already name the version this bump
            # proposes. Read the version out of the bump itself, and the
            # changelog out of the gated tree — the two refs differ, which is
            # why both are API reads and neither is a checkout. Whole files
            # into variables, never `gh api | grep -q`: a `-q` that exits on
            # the first match SIGPIPEs the reader, and under `pipefail` the
            # match would read as a failure.
            if ! manifest="$(gh api "repos/$GH_REPO/contents/Cargo.toml?ref=$sha" \
              -H 'Accept: application/vnd.github.raw')"; then
              printf 'PR %s  hold: could not read Cargo.toml at %s; the next wake-up re-judges  [merge state %s]\n' \
                "$number" "${sha:0:8}" "$state"
              continue
            fi
            version="$(awk '/^\[package\]/ { p = 1 }
                            p && /^version = / { gsub(/^version = "|"$/, ""); print; exit }' \
                       <<<"$manifest")"
            if [ -z "$version" ]; then
              printf 'PR %s  hold: no [package] version in Cargo.toml at %s\n' \
                "$number" "${sha:0:8}"
              continue
            fi
            if ! changelog="$(gh api "repos/$GH_REPO/contents/CHANGELOG.md?ref=$GATED_SHA" \
              -H 'Accept: application/vnd.github.raw')"; then
              printf 'PR %s  hold: could not read CHANGELOG.md at %s; the next wake-up re-judges  [merge state %s]\n' \
                "$number" "${GATED_SHA:0:8}" "$state"
              continue
            fi
            # `make promote-changelog`'s own predicate, with the compare URL
            # derived from the repository rather than restated.
            if ! grep -qF "## [$version](https://github.com/$GH_REPO/compare/" <<<"$changelog"; then
              printf 'PR %s  hold: CHANGELOG.md at %s does not name [%s] yet — land `make promote-changelog VERSION=%s` on main  [merge state %s]\n' \
                "$number" "${GATED_SHA:0:8}" "$version" "$version" "$state"
              continue
            fi

            printf 'PR %s  merging: %s bump on the gated %s, changelog stamped  [merge state %s]\n' \
              "$number" "$version" "${GATED_SHA:0:8}" "$state"
            # No --delete-branch: `delete_branch_on_merge` is enabled on this
            # repository, so GitHub deletes the merged head itself.
            gh pr merge "$number" --merge
            printf 'PR %s  merged\n' "$number"
            merged=$((merged + 1))
          done <<<"$verdicts"

          if [ "$merged" -eq 0 ]; then
            echo "merged nothing; no dispatch"
            exit 0
          fi

          # The merge was GITHUB_TOKEN's, so it created no workflow run at all.
          # This dispatch is the only thing that will publish the bump, and it
          # re-runs the whole gate on the merged tree before doing so.
          echo "dispatching release-plz.yml on main to publish the merged bump"
          gh workflow run release-plz.yml --ref main

  prune-release-branches:
    name: prune superseded release branches
    # `needs` with no `if` means: only after the release-PR job actually ran and
    # succeeded. On workflow_dispatch that job is skipped, so this one is
    # too — pruning only ever follows a PR refresh.
    needs: release-plz-pr
    # release-plz pushes a NEW timestamped `release-plz-*` branch every time it
    # refreshes the release PR and leaves the previous one behind. Worse, it
    # pushes the branch BEFORE opening the PR, so if PR creation fails (as it
    # did across brazen before "Allow GitHub Actions to create and approve pull
    # requests" was enabled — 24 orphaned branches, zero PRs) the branch is
    # stranded with no PR to ever close or merge. Unattended, that is one dead
    # branch per push to main.
    #
    # The repo's "Automatically delete head branches" setting only fires on
    # MERGE, which covers the happy path and nothing else. This job covers the
    # rest: it runs immediately after the PR job, so the branch backing the
    # CURRENT release PR is already open, and "has no open PR" is therefore an
    # exact test for "superseded or orphaned". No allowlist, no age heuristic,
    # no state to keep — the open-PR set is the single source of truth.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Delete every release-plz-* branch with no open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          open="$(gh pr list --state open --json headRefName -q '.[].headRefName')"
          git ls-remote --heads origin 'refs/heads/release-plz-*' |
            awk '{print $2}' | sed 's#refs/heads/##' |
            while read -r branch; do
              if grep -qxF "$branch" <<<"$open"; then
                echo "keep    $branch (backs an open PR)"
              else
                echo "delete  $branch"
                git push origin --delete "$branch"
              fi
            done
