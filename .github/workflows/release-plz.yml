name: Release-plz

# Build-gated, hands-off release. Five jobs, all in ONE push-triggered run:
#
#   * ci — the full CI workflow, executed here via
#     `uses: ./.github/workflows/ci.yml` (workflow_call). A called workflow
#     runs INSIDE the caller's run, and that placement is the point: crates.io
#     trusted publishing REFUSES OIDC tokens minted under a `workflow_run`
#     trigger ("due to security concerns"), which is how the release job used
#     to be gated — CI green never published anything. Running CI as a called
#     job instead keeps the OIDC claim at trigger=push / workflow
#     release-plz.yml (the identity crates.io trusts) while the release job
#     still hard-gates on it via `needs:`. ci.yml has no push arm of its own,
#     so per push to main CI runs exactly once — here (PRs still trigger
#     ci.yml directly).
#   * release-plz PR (every push to main) — opens/updates ONE "release PR" that
#     bumps the version in Cargo.toml/Cargo.lock, and nothing else: CHANGELOG.md
#     is hand-maintained and release-plz never writes it (`changelog_update =
#     false` in release-plz.toml — rationale there, bl-7558). It never
#     publishes; it just keeps the next release queued. Merging that PR is the
#     human control point — and BEFORE merging it, land `make promote-changelog
#     VERSION=<the version the PR proposes>` on main (via the normal task-
#     worktree flow), which stamps the accumulated [Unreleased] section as that
#     version. The GitHub Release body is empty by consequence (release-plz
#     takes it from the changelog only when it manages the changelog);
#     CHANGELOG.md in the tagged tree is the record. It does not wait on the ci job — it touches
#     no artifact that CI protects.
#   * release (`needs: ci`, so only after CI in THIS run is green) — releases
#     any version on main that is not out yet: tags it `v<version>`, cuts a
#     GitHub Release and publishes it to crates.io. A release only ever ships
#     a GREEN build — never an untested commit.
#   * release-binaries — builds the `litany` binary and attaches its linux-gnu archive to that
#     Release. It runs in the SAME workflow run and `needs:` the release job,
#     NOT as a separate `on: release` workflow — a Release created by the
#     default GITHUB_TOKEN cannot trigger another workflow (GitHub's
#     anti-recursion rule), so a separate binaries workflow would silently never
#     fire without a PAT. `workflow_dispatch` with `binaries_tag` backfills an
#     existing tag (still behind the CI gate, like everything downstream of
#     `needs: ci`).
#   * prune-release-branches (right after the release-plz PR job) — deletes
#     every `release-plz-*` branch that has no open PR. release-plz pushes a NEW
#     timestamped branch each time it refreshes the release PR, and pushes it
#     BEFORE opening the PR, so superseded and orphaned branches pile up one per
#     push to main — GitHub's "Automatically delete head branches" setting only
#     fires on merge and never sees them. Because this job runs right after the
#     PR job, the current release PR is already open, which makes "has no open
#     PR" an exact test for "superseded or orphaned".
#
# So the flow is: merge work to main -> this run's ci job runs CI and the
# release PR is kept fresh; when releasing, land the promote-changelog commit
# (above), then merge the release PR -> the next run's ci job goes green -> the
# new version is released AND its binaries build and upload.
# `workflow_dispatch` is the manual escape hatch: same chain (ci -> release ->
# binaries), triggered by hand.
#
# Bumps default to PATCH (0.0.1 -> 0.0.2). See release-plz.toml for the
# `[minor]` / `[major]` opt-in markers.
#
# One-time repo setup:
#   * Settings -> Actions -> General -> Workflow permissions: enable "Allow
#     GitHub Actions to create and approve pull requests" — else the release-pr
#     job 403s ("GitHub Actions is not permitted to create or approve pull
#     requests").
#   * A crates.io TRUSTED PUBLISHER for the `litany` crate — the model that
#     replaces a stored API token: instead of keeping a long-lived secret in
#     this repo, crates.io records that one named workflow file in one named
#     GitHub repo may publish one named crate, and at run time GitHub mints a
#     short-lived signed OIDC token asserting exactly that identity (repo,
#     workflow, ref). release-plz trades it for a ~30-minute crates.io token
#     scoped to this crate, so there is no secret in the repo to leak and a
#     captured token expires in minutes. Configure it at
#     https://crates.io/crates/litany/settings -> Trusted Publishing, with
#     owner `mudbungie`, repository `litany`, workflow filename
#     `release-plz.yml`, environment empty — the filename is matched literally
#     against the OIDC claim, so RENAMING THIS FILE breaks publishing until
#     the crates.io entry is updated to match.
#
#     The release job asks GitHub for that token via `id-token: write`; nothing
#     else is needed and NO CARGO_REGISTRY_TOKEN secret is set. release-plz
#     performs the exchange internally (it implements the same crates.io API
#     calls as rust-lang/crates-io-auth-action), so that action must NOT also
#     be added. Caveat: trusted publishing cannot create a crate that does not
#     exist yet — `litany` was published manually at 0.0.0, which satisfies it.
#   * RELEASE_PLZ_TOKEN — OPTIONAL fine-grained PAT (contents + pull-requests
#     write), so the release PR's own commits re-trigger CI. The default
#     GITHUB_TOKEN cannot trigger workflows from its own pushes; the job falls
#     back to it when RELEASE_PLZ_TOKEN is unset.

# No `workflow_run` arm — crates.io refuses trusted publishing under it (see
# the ci job above); the CI gate is the in-run `needs: ci` instead.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      binaries_tag:
        description: "Build + upload binaries for this existing tag (e.g. v0.0.1). Leave empty for a normal publish."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    name: CI
    # The full CI workflow, run inside THIS run (see the header: the release
    # job `needs:` this, and workflow_call placement is what keeps the OIDC
    # claim publishable). Runs on both triggers — push and manual dispatch —
    # so a dispatched release is gated exactly like an automatic one. Job-level
    # `permissions` on a `uses:` job set the ceiling for every job in the
    # called workflow; CI only checks out and builds, so read suffices.
    if: github.repository_owner == 'mudbungie'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    # Only a direct push to main maintains the release PR (not a manual
    # dispatch). Owner guard: never runs in a fork. Safe against fork-PR
    # abuse because none of this workflow's triggers are reachable from a fork
    # PR — a fork PR fires `pull_request` (not requested here), never
    # `push`-to-main / `workflow_dispatch`, both of which need
    # write access to upstream.
    if: github.repository_owner == 'mudbungie' && github.event_name == 'push'
    # Never run two release-PR updates at once — they would race on the branch.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # No registry credential here: this job only opens the release PR, it
          # never publishes.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    # Release only on a GREEN build: `needs` on the called CI workflow above.
    # If any CI job fails (or the ci job is skipped, as in a fork), this job
    # is skipped — the implicit success() in `if` sees to it. This is the
    # whole build gate; there is no workflow_run arm anymore.
    needs: ci
    # Job-level permissions REPLACE the workflow-level block rather than adding
    # to it, so `contents: write` is restated here — the job needs it to push
    # the `v<version>` tag and cut the GitHub Release. `id-token: write` is the
    # trusted-publishing grant: it lets the job ask GitHub for the signed OIDC
    # token that release-plz trades for a short-lived crates.io token (see the
    # header). It is scoped to this one job — the other jobs never publish.
    permissions:
      contents: write
      id-token: write
    # Owner guard (redundant with the ci job's, kept as defense in depth).
    # Both triggers release once CI is green: that is the point for push, and
    # for workflow_dispatch it is the manual escape hatch.
    if: github.repository_owner == 'mudbungie'
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    # Tell the binaries job whether a release actually happened, and WHICH tag
    # it cut. The tag must be handed off here, not re-derived downstream: this
    # job checks out the BRANCH tip (which may have advanced past the run's
    # pinned sha while CI ran), so the new tag can be a descendant of
    # github.sha — invisible to any ancestor walk (`git describe`) from the
    # binaries job's own checkout. The action's `releases` output is the one
    # authoritative record of what was tagged.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the BRANCH, not a bare SHA: release-plz runs `git rev-parse
          # @{upstream}` to find the current branch, which fails on a detached
          # HEAD. `ref_name` is main for both triggers (push to main, and a
          # manual dispatch on main).
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # Publishing is authenticated by trusted publishing (`id-token: write`
          # above), not by a stored registry secret.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract the released tag
        # `releases` is the action's JSON record of what it just released,
        # e.g. [{"package_name":"litany","prs":[],"tag":"v0.0.1","version":
        # "0.0.1"}]. One crate in this workspace releases, so .[0].tag is it.
        # Via env, not inline interpolation, so the JSON never touches the
        # shell as code.
        id: released
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: echo "tag=$(jq -r '.[0].tag' <<<"$RELEASES")" >> "$GITHUB_OUTPUT"

  release-binaries:
    name: litany x86_64-unknown-linux-gnu
    needs: release-plz-release
    # Build binaries when a release was just cut, OR for a tag named manually
    # (backfill). `needs` is skipped when the release job was skipped, so this
    # can never run in a fork either.
    if: >-
      needs.release-plz-release.outputs.releases_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.binaries_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve + check out the release tag
        id: tag
        shell: bash
        env:
          # Manual backfill input wins; otherwise the tag the release job just
          # cut, handed off via its `tag` output. Never re-derived here with
          # `git describe`: this job checks out the run's pinned sha, and the
          # release job tags the branch TIP — which can be a descendant of
          # that sha (main advanced during CI), so an ancestor walk from here
          # misses the tag. Exactly that raced on the v0.0.1 publish.
          BACKFILL_TAG: ${{ github.event.inputs.binaries_tag }}
          RELEASED_TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: |
          tag="${BACKFILL_TAG:-$RELEASED_TAG}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Build the tagged (released) code, not whatever main's tip is now.
          # The tag ref (and its commit) arrived with the fetch-depth-0
          # checkout, which ran after the release job pushed it (`needs`).
          git checkout "$tag"
      - uses: dtolnay/rust-toolchain@stable
      # Builds `cargo build --release`, archives the binaries as
      # litany-x86_64-unknown-linux-gnu.tar.gz and uploads it to the Release
      # for the resolved tag. Uploading assets with GITHUB_TOKEN is fine — only
      # *triggering a new workflow* from a token-made event is what GitHub blocks.
      #
      # `include:` puts README.md and LICENSE in the archive beside the
      # binary. Until bl-33ef the tarball was one bare executable, so a
      # release user had no install instructions at all — not the `bz`
      # step, not the pin, not the harness-root note — while the crates.io
      # user got the same README as the landing page. The docs ride with
      # the artifact for the same reason the pin does: reachable from what
      # you downloaded, not only from the repo you did not clone.
      - name: Build and upload litany
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: litany
          target: x86_64-unknown-linux-gnu
          archive: litany-$target
          include: README.md,LICENSE
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  prune-release-branches:
    name: prune superseded release branches
    # `needs` with no `if` means: only after the release-PR job actually ran and
    # succeeded. On workflow_dispatch that job is skipped, so this one is
    # too — pruning only ever follows a PR refresh.
    needs: release-plz-pr
    # release-plz pushes a NEW timestamped `release-plz-*` branch every time it
    # refreshes the release PR and leaves the previous one behind. Worse, it
    # pushes the branch BEFORE opening the PR, so if PR creation fails (as it
    # did across brazen before "Allow GitHub Actions to create and approve pull
    # requests" was enabled — 24 orphaned branches, zero PRs) the branch is
    # stranded with no PR to ever close or merge. Unattended, that is one dead
    # branch per push to main.
    #
    # The repo's "Automatically delete head branches" setting only fires on
    # MERGE, which covers the happy path and nothing else. This job covers the
    # rest: it runs immediately after the PR job, so the branch backing the
    # CURRENT release PR is already open, and "has no open PR" is therefore an
    # exact test for "superseded or orphaned". No allowlist, no age heuristic,
    # no state to keep — the open-PR set is the single source of truth.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Delete every release-plz-* branch with no open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          open="$(gh pr list --state open --json headRefName -q '.[].headRefName')"
          git ls-remote --heads origin 'refs/heads/release-plz-*' |
            awk '{print $2}' | sed 's#refs/heads/##' |
            while read -r branch; do
              if grep -qxF "$branch" <<<"$open"; then
                echo "keep    $branch (backs an open PR)"
              else
                echo "delete  $branch"
                git push origin --delete "$branch"
              fi
            done
