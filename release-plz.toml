# Version-bump policy.
#
# Every source commit here is a short imperative subject plus a `[bl-xxxx]`
# trailer — not Conventional Commits — so release-plz's default increment
# applies, which is PATCH: 0.0.1 -> 0.0.2. That is the intended default; the
# release PR should always propose the smallest step.
#
# To opt in to a bigger bump, put `[minor]` or `[major]` as a standalone
# bracketed token in any commit message that lands in the release window —
# preceded by start-of-string or whitespace, followed by end-of-string or
# whitespace. For non-conventional messages release-plz matches the regex
# against the full commit text, so the marker can sit in the subject (alongside
# `[bl-xxxx]`) or in the body. Prose mentions like `[minor]/[major]`
# (slash-joined, no boundary whitespace) do not match — that keeps a commit
# describing this convention from bumping itself.
#
# `features_always_increment_minor` is left at its default (false), so even a
# Conventional-Commit `feat:` lands as a patch bump below 1.0.0.
#
# CHANGELOG.md is hand-maintained and release-plz never writes it
# (`changelog_update = false`). One authority, two reasons (bl-7558):
#
#   * Docs-only deliveries are invisible to generation. A delivery that
#     touches no packaged file (e.g. bl-3c76, a design doc) produces no
#     commit release-plz attributes to the crate, so a generated changelog
#     silently omits it. The hand-kept `[Unreleased]` list is the only
#     record that can be complete, which makes it load-bearing — and two
#     writers on one file drift (the 0.0.4 release PR staged a generated
#     section on top of the manual one: every bullet twice).
#
#   * Generation itself proved untrustworthy for this repo's
#     non-conventional subjects. release-plz runs every commit through
#     git-cliff's processing TWICE — once in its own ChangelogBuilder and
#     again inside git-cliff's Changelog — so `commit_preprocessors` apply
#     twice, and the parser strips a leading `word:` token from any subject
#     that happens to parse as a Conventional Commit (`fleet: drop …`
#     rendered as `drop …`, bl-1923). The bl-1923 compensation (duplicate
#     the token, let the parser eat the copy) was correct for one pass and
#     doubled under two (`fleet: fleet: drop …`, bl-7558). Subtraction, not
#     a third layer: no generation, no parser, nothing to compensate.
#
# So the release PR bumps versions only. Each delivery adds its own bullet
# under `## [Unreleased]` (CHANGELOG.md's header states the format), and at
# release time `make promote-changelog VERSION=x.y.z` stamps that section as
# the new version — see the Makefile target and the release-plz.yml header
# for the ordering.
[workspace]
semver_check = false
changelog_update = false
# The engine restarted its numbering at the bl-2f58 fence (litany 0.0.1), and
# the bare v0.0.1..v0.0.11 tags are already taken by the lernie-era releases
# in this same history — a crate-prefixed tag keeps the two eras' tags
# distinct, and tests/changelog_completeness.rs lists both patterns.
git_tag_name = "litany-v{{ version }}"
custom_minor_increment_regex = '(^|\s)\[minor\](\s|$)'
custom_major_increment_regex = '(^|\s)\[major\](\s|$)'

# agent-eval is an internal-only crate (`publish = false` in
# crates/agent-eval/Cargo.toml) — the workspace's eval runner, not a shipped
# artifact. Keep release-plz off it entirely: no version bump, no tag, no
# GitHub Release, no crates.io publish.
#
# Both keys are required: `release = false` only tells release-plz to skip
# version-bump/tag/GitHub-Release for this package, but release-plz validates
# `publish` independently against Cargo.toml's own `publish` field regardless
# of `release`. Without `publish = false` here, `release-plz release` aborts
# with "has `publish = false` ... but it has `publish = true` in the
# release-plz configuration" before publishing anything, for any crate.
# Cargo.toml stays the single source of truth on publishability; this key
# exists only so release-plz's own validator agrees with it.
[[package]]
name = "agent-eval"
release = false
publish = false

# litany-eval-agent is internal-only for the same reason (`publish = false`
# in crates/litany-eval-agent/Cargo.toml) — the eval harness driver, the
# agent-eval runner's counterpart (README "Run the suite"). Both keys, for
# the reason spelled out above: `release = false` alone still leaves
# release-plz's publishability validator disagreeing with Cargo.toml, which
# aborts `release-plz release` for every crate.
[[package]]
name = "litany-eval-agent"
release = false
publish = false
