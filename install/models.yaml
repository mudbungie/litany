# Global config-root models.yaml (ARCH §4.2; the config root is
# $XDG_CONFIG_HOME/litany, default ~/.config/litany — ARCH §2.2).
#
# Mechanism only — this file ships no model policy (bl-35e2). Which
# providers exist, their endpoints, auth, and the login workflow are
# brazen's (`bz --login --provider <row>`, `bz --dump-config`; rows are
# declared in ~/.config/brazen/config.toml and brazen's built-in
# defaults). Which model each role uses is the conversation repo's
# `providers.yaml` `roles:` section (ARCH §4.3) — authored per repo,
# overridable install-wide via `<config-root>/template/providers.yaml`.
# A model id is validated by the wire at the first live model call
# (ARCH §4.2), never against a table here.
#
# The one thing this file can declare is an optional `adapter:` line —
# an absolute path to a bz-contract-compatible binary that overrides the
# default `bz` on PATH (§4.2 / §4.4). Omit it to use the pinned `bz` the
# load-time version guard checks.
#
# adapter: /path/to/bz-compatible-binary
#
# `litany prime` / `make install` lay this down only if no models.yaml
# already exists at the config root, so re-running install never
# clobbers a hand-edited file.
