[workspace]
members = [".", "crates/agent-eval", "crates/litany-eval-agent"]

# The brazen version pin's ONE home (README "The pinned adapter under
# test"; Makefile BRAZEN_PIN seds this line). Both the litany core and
# the workspace-internal `agent-eval` (which reads the same `v=1` event
# vocabulary off `response.json`, ARCH §9.3) inherit it via
# `workspace = true`, so the pin cannot drift between them.
[workspace.dependencies]
brazen = "=0.0.14"

[package]
name = "litany"
version = "0.0.10"
edition = "2024"
description = "A git-backed agent harness"
license = "MIT"
repository = "https://github.com/mudbungie/litany"
keywords = ["agent", "llm", "git", "harness", "cli"]
categories = ["development-tools", "command-line-utilities"]
# The floor is the crate's own source, not the edition: edition 2024 needs
# 1.85, but `let` chains (used in `src/prompt/mod.rs` and elsewhere) only
# stabilized in 1.88. Verified by building the workspace under each:
# 1.85 fails with E0658 `let` expressions in this position are unstable;
# 1.88 builds clean. Without this line an old-rustc user gets that E0658
# wall instead of cargo's one-line "requires rustc 1.88" message.
rust-version = "1.88"

# Repo-development files, kept out of the published tarball. What stays is
# what a consumer builds and reads: `src/`, the embedded asset trees
# (`template/`, `schemas/`, `skills/`, `workflows/`, `install/models.yaml` —
# the `include_dir!`/`include_str!` inputs, whose absence is a build failure),
# `README.md`, `LICENSE`, `Cargo.lock`. Everything below serves the git
# checkout only: `rust-toolchain.toml` would force a source builder onto
# this repo's exact pinned toolchain, and `tests/` are repo-side gates
# (including `tests/suite/`, the evaluation task data read by the
# workspace-internal `agent-eval`, never by the published crate).
exclude = [
    "/.balls",
    "/.githooks",
    "/.github",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/Makefile",
    "/docs",
    "/experiments",
    "/release-plz.toml",
    "/rust-toolchain.toml",
    "/scripts",
    "/tarpaulin.toml",
    "/tests",
]

[dependencies]
brazen = { workspace = true }
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
schemars = "0.8"
thiserror = "2"
# `now` and NOT `clock`, and the difference is load-bearing for the macOS
# artifact (`Containerfile.mac`). `clock` is `now` plus local-timezone
# detection, which pulls `iana-time-zone` — and on darwin that links the
# CoreFoundation framework, which no lawful Linux cross-build can supply (the
# cross toolchain ships libSystem and no framework stubs). This crate uses
# `Utc` only: `src/prompt/clock.rs` is the whole of the use. Narrowing to `now`
# drops five crates from the lockfile and ports the mac build by the same edit.
# Widening it back un-ports that build.
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
# The command-surface parity checker (`tests/command_surface_parity/`,
# ARCH §3.4) parses the crate's source as the ground truth of what is
# `pub` (syn) and introspects the CLI's verb set through the one clap in
# [dependencies] — the checker itself links nothing but `cmd`.
syn = { version = "2", features = ["full", "parsing"] }

[[bin]]
name = "litany"
path = "src/bin/litany/main.rs"
